name: Task 5 Patch

permissions:
  contents: write

on:
  push:
    branches:
      - task5-validation-temp

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Repair staging patcher anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.task5/patch_task5.py')
          text = path.read_text(encoding='utf-8')
          old = '''anchor = "    def _legacy_review_candidate(\\n"
          if anchor not in text:
              raise SystemExit("current method insertion anchor missing")
          text = text.replace(anchor, current_methods + anchor, 1)
          '''
          new = '''match = re.search(r"(?m)^    def _legacy_review_candidate(?=\\()", text)
          if match is None:
              raise SystemExit("current method insertion anchor missing")
          text = text[:match.start()] + current_methods + text[match.start():]
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'match = re.search(r"(?m)^    def _legacy_review_candidate' not in text:
              raise SystemExit('staging patcher repair anchor differs')
          PY
      - name: Apply service migration once
        shell: bash
        run: |
          if ! grep -q 'from .service_runtime_v3 import (' components/worker-lab/worker_lab/application_service.py; then
            python .task5/patch_task5.py
          fi
      - name: Remove obsolete V2 public-service test block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/worker-lab/tests/test_application_service.py')
          text = path.read_text(encoding='utf-8')
          start_marker = 'def test_invocation_prepare_authorize_and_reject_are_durable_without_dispatch('
          end_marker = 'def test_backup_verify_and_restore_are_versioned_service_operations('
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start >= 0:
              if end <= start:
                  raise SystemExit('V2 service test block end marker missing')
              text = text[:start] + text[end:]
              path.write_text(text, encoding='utf-8')
          elif 'test_v3_prepare_binds_logical_target_provider_binding_and_controller_packet' not in Path('components/worker-lab/tests/test_application_service_v3.py').read_text(encoding='utf-8'):
              raise SystemExit('V2 service test block start marker missing')
          PY
      - name: Refresh Worker Lab portable V1 source identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def bytes_digest(data):
              return "sha256:" + hashlib.sha256(data).hexdigest()

          def canonical_digest(value):
              encoded = json.dumps(value, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return bytes_digest(encoded)

          root = Path("components/worker-lab")
          entries = [
              {"path": path.relative_to(root).as_posix(), "sha256": bytes_digest(path.read_bytes())}
              for path in sorted((root / "worker_lab").rglob("*.py"))
              if "__pycache__" not in path.parts
          ]
          if len(entries) != 35:
              raise SystemExit(f"expected 35 Worker Lab production files, observed {len(entries)}")
          digest = canonical_digest(entries)
          path = Path("config/portable-installation-manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["components"]["worker-lab"]["digest"] = digest
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"WORKER_LAB_FILE_COUNT={len(entries)}")
          print(f"WORKER_LAB_PORTABLE_DIGEST={digest}")
          PY
      - name: Compile Task 5 current path
        run: >-
          python -m compileall -q
          components/worker-lab/worker_lab/application_service.py
          components/worker-lab/worker_lab/controller_task_packet.py
          components/worker-lab/worker_lab/cli.py
          components/worker-lab/worker_lab/invocation_store_v3.py
          components/worker-lab/worker_lab/result_acceptance_v3.py
          components/worker-lab/worker_lab/git_workspace_evidence.py
          components/worker-lab/worker_lab/service_runtime_v3.py
          components/worker-lab/tests/test_application_service_v3.py
      - name: Run V3 foundation and Task 5 service tests
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_controller_task_packet.py
          tests/test_dispatch_client.py
          tests/test_integration_v3.py
          tests/test_provider_binding.py
          tests/test_runtime_selection_v3.py
          tests/test_application_service_v3.py
      - name: Run unaffected application-service regressions
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q tests/test_application_service.py
          -k "not health_and_installation_status_are_non_mutating_and_disabled and not absent_data_root_is_healthy_empty_and_remains_absent and not queries_reject_invalid_data_roots_without_mutation and not cli_exposes_service_health_list_and_show"
      - name: Run unaffected CLI regressions
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q tests/test_cli.py
          -k "not doctor_reports_disabled_installation_without_execution"
      - name: Confirm known legacy manifest boundary remains isolated
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_application_service.py::test_health_and_installation_status_are_non_mutating_and_disabled \
            tests/test_cli.py::test_doctor_reports_disabled_installation_without_execution \
            > /tmp/task5-known-boundary.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'framework runtime closure is incomplete' /tmp/task5-known-boundary.log
          echo 'KNOWN_LEGACY_MANIFEST_BOUNDARY=CONFIRMED'
      - name: Commit materialized Task 5 patch
        shell: bash
        run: |
          if ! git diff --quiet -- components/worker-lab config/portable-installation-manifest.json; then
            git config user.name "Task 5 Validation"
            git config user.email "actions@users.noreply.github.com"
            git add components/worker-lab/worker_lab/application_service.py components/worker-lab/worker_lab/controller_task_packet.py components/worker-lab/worker_lab/cli.py components/worker-lab/tests/test_controller_task_packet.py components/worker-lab/tests/test_application_service.py components/worker-lab/tests/test_application_service_v3.py config/portable-installation-manifest.json
            git commit -m "wip: validate V3 application service migration"
            git push origin HEAD:task5-validation-temp
          fi

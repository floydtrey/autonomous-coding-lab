name: Task 8 Source Identity V2
on:
  push:
    branches: [task8-portable-identity-docs-temp]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Materialize V2 candidate
        run: python .task8/apply_task8.py
      - name: Refresh source component digests
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path.cwd(); path=root/'config/portable-source-manifest.json'; m=json.loads(path.read_text())
          def canon(v): return json.dumps(v,ensure_ascii=False,allow_nan=False,sort_keys=True,separators=(',',':'))
          def digest(v): return 'sha256:'+hashlib.sha256(canon(v).encode()).hexdigest()
          def bd(p): return 'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          for name,c in m['components'].items():
              base=root/c['root']
              if c['scope']=='runtime-dependency-closure': files=tuple(c['files'])
              else:
                  prod=base/c['production_root']
                  files=tuple(sorted(p.relative_to(base).as_posix() for p in prod.rglob('*.py') if '__pycache__' not in p.parts))
              entries=[{'path':f,'sha256':bd(base/f)} for f in files]
              c['digest']=digest(entries)
              print(name,len(files),c['digest'])
          path.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Compile current production
        run: python -m compileall -q components/autonomous-worker-framework/tools components/worker-lab/worker_lab tools/verify_portable_source.py
      - name: Run focused V2 and V3 contracts
        env:
          PYTHONPATH: components/worker-lab
        run: |
          python -m pytest -q tests/test_portable_source.py
          cd components/worker-lab
          python -m pytest -q tests/test_operator_control.py tests/test_provider_qualification.py tests/test_provider_binding.py tests/test_runtime_selection_v3.py tests/test_dispatch_client.py tests/test_integration_v3.py tests/test_invocation_store_v3.py tests/test_application_service_v3.py tests/test_cli.py
      - name: Verify source report is host and activation neutral
        run: |
          python tools/verify_portable_source.py > /tmp/source-report.json
          cat /tmp/source-report.json
          python - <<'PY'
          import json
          v=json.load(open('/tmp/source-report.json'))
          text=json.dumps(v,sort_keys=True)
          for forbidden in ('execution_authority','host_requirements','python_executable','provider_runtime','execution_ready'):
              assert forbidden not in text, forbidden
          assert all(x['status']=='MATCH' for x in v['components'].values())
          PY

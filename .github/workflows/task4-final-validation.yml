name: Task 4 Final Validation

on:
  push:
    branches:
      - task4-final-validation-temp

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Compile Task 4 code
        run: >-
          python -m compileall -q
          components/autonomous-worker-framework/tools/dispatch_adapter.py
          components/autonomous-worker-framework/tests/test_dispatch_adapter.py
          components/worker-lab/worker_lab/dispatch_client.py
          components/worker-lab/tests/test_dispatch_client.py
      - name: Framework Task 4 regressions
        working-directory: components/autonomous-worker-framework
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_dispatch_adapter.py
          tests/test_code_task.py
          tests/test_consumer_profile.py
          tests/test_pydantic_ollama_worker.py
      - name: Worker Lab Task 4 and V3 regressions
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_dispatch_client.py
          tests/test_integration_v3.py
          tests/test_provider_binding.py
          tests/test_runtime_selection_v3.py
      - name: Portable identity contract
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          p = Path('tools/verify_portable_installation.py')
          spec = importlib.util.spec_from_file_location('portable', p)
          module = importlib.util.module_from_spec(spec)
          assert spec is not None and spec.loader is not None
          spec.loader.exec_module(module)
          manifest = json.loads(Path('config/portable-installation-manifest.json').read_text(encoding='utf-8'))
          root = Path.cwd()
          assert manifest['activation_policy']['execution_authority'] == 'DISABLED'
          framework = module._inspect_component(root, 'autonomous-worker-framework', manifest['components']['autonomous-worker-framework'])
          worker = module._inspect_component(root, 'worker-lab', manifest['components']['worker-lab'])
          assert framework['status'] == 'MATCH', framework
          assert worker['status'] == 'MATCH', worker
          print('autonomous-worker-framework=MATCH')
          print('worker-lab=MATCH')
          PY
          python -m pytest -q tests/test_portable_installation.py
      - name: No legacy provider dependency in new dispatch seam
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('components/autonomous-worker-framework/tools/dispatch_adapter.py'),
              Path('components/worker-lab/worker_lab/dispatch_client.py'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8').lower()
              assert 'codex' not in text, path
              assert 'terra' not in text, path
              assert 'fallback provider' not in text, path
          PY

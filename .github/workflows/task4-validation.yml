name: Task 4 Validation

permissions:
  contents: write

on:
  push:
    branches:
      - task4-validation-temp

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic test dependency
        run: python -m pip install pytest

      - name: Compile Task 4 code
        run: >-
          python -m compileall -q
          components/autonomous-worker-framework/tools/dispatch_adapter.py
          components/autonomous-worker-framework/tests/test_dispatch_adapter.py
          components/worker-lab/worker_lab/dispatch_client.py
          components/worker-lab/tests/test_dispatch_client.py

      - name: Run framework Task 4 and stable generic regressions
        working-directory: components/autonomous-worker-framework
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_dispatch_adapter.py
          tests/test_code_task.py
          tests/test_consumer_profile.py
          tests/test_pydantic_ollama_worker.py

      - name: Run Worker Lab Task 4 and V3 regressions
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_dispatch_client.py
          tests/test_integration_v3.py
          tests/test_provider_binding.py
          tests/test_runtime_selection_v3.py

      - name: Confirm client and adapter protocol constants agree
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def constants(path):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"))
              values = {}
              for node in tree.body:
                  if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                      if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                          values[node.targets[0].id] = node.value.value
              return values

          client = constants("components/worker-lab/worker_lab/dispatch_client.py")
          adapter = constants("components/autonomous-worker-framework/tools/dispatch_adapter.py")
          for name in ("DISPATCH_REQUEST_SCHEMA", "DISPATCH_RESPONSE_SCHEMA", "WORKSPACE_WRITE_TASK_SCHEMA"):
              assert client[name] == adapter[name], (name, client[name], adapter[name])
          PY

      - name: Refresh portable V1 source identities mechanically
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          def bytes_digest(data):
              return "sha256:" + hashlib.sha256(data).hexdigest()

          def canonical_digest(entries):
              encoded = json.dumps(entries, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return "sha256:" + hashlib.sha256(encoded).hexdigest()

          verifier_path = Path("tools/verify_portable_installation.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          if '    "tools/dispatch_adapter.py",\n' not in verifier:
              anchor = '    "tools/consumer_profile.py",\n'
              if anchor not in verifier:
                  raise SystemExit("framework portable closure anchor differs")
              verifier = verifier.replace(anchor, anchor + '    "tools/dispatch_adapter.py",\n', 1)
              verifier_path.write_text(verifier, encoding="utf-8")

          tree = ast.parse(verifier)
          framework_files = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  if node.targets[0].id == "_FRAMEWORK_FILES":
                      framework_files = tuple(ast.literal_eval(node.value))
                      break
          if framework_files is None or len(framework_files) != 12:
              raise SystemExit("framework portable closure does not contain exactly 12 files")
          if framework_files != tuple(sorted(framework_files)):
              raise SystemExit("framework portable closure is not sorted")

          framework_root = Path("components/autonomous-worker-framework")
          framework_entries = [
              {"path": name, "sha256": bytes_digest((framework_root / name).read_bytes())}
              for name in framework_files
          ]
          framework_digest = canonical_digest(framework_entries)

          worker_root = Path("components/worker-lab")
          worker_entries = []
          for path in sorted((worker_root / "worker_lab").rglob("*.py")):
              if "__pycache__" in path.parts:
                  continue
              worker_entries.append({
                  "path": path.relative_to(worker_root).as_posix(),
                  "sha256": bytes_digest(path.read_bytes()),
              })
          if len(worker_entries) != 31:
              raise SystemExit(f"expected 31 Worker Lab production files, observed {len(worker_entries)}")
          worker_digest = canonical_digest(worker_entries)

          manifest_path = Path("config/portable-installation-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["components"]["autonomous-worker-framework"]["files"] = list(framework_files)
          manifest["components"]["autonomous-worker-framework"]["digest"] = framework_digest
          manifest["components"]["worker-lab"]["digest"] = worker_digest
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          print(f"FRAMEWORK_FILE_COUNT={len(framework_entries)}")
          print(f"FRAMEWORK_PORTABLE_DIGEST={framework_digest}")
          print(f"WORKER_LAB_FILE_COUNT={len(worker_entries)}")
          print(f"WORKER_LAB_PORTABLE_DIGEST={worker_digest}")
          PY

      - name: Verify portable V1 component bytes and contract tests
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          tool_path = Path("tools/verify_portable_installation.py")
          spec = importlib.util.spec_from_file_location("portable", tool_path)
          module = importlib.util.module_from_spec(spec)
          assert spec is not None and spec.loader is not None
          spec.loader.exec_module(module)
          manifest = json.loads(Path("config/portable-installation-manifest.json").read_text(encoding="utf-8"))
          root = Path.cwd()
          for name in ("autonomous-worker-framework", "worker-lab"):
              result = module._inspect_component(root, name, manifest["components"][name])
              assert result["status"] == "MATCH", result
              print(f"{name}=MATCH")
          PY
          python -m pytest -q tests/test_portable_installation.py

      - name: Commit portable refresh on temporary branch
        shell: bash
        run: |
          if ! git diff --quiet -- tools/verify_portable_installation.py config/portable-installation-manifest.json; then
            git config user.name "Task 4 Validation"
            git config user.email "actions@users.noreply.github.com"
            git add tools/verify_portable_installation.py config/portable-installation-manifest.json
            git commit -m "chore: refresh Task 4 portable identity"
            git push origin HEAD:task4-validation-temp
          fi

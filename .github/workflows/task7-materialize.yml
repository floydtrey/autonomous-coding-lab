name: Task 7 Materialize Candidate
on:
  push:
    branches: [task7-obsolete-cleanup-temp]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize validated Task 7 bytes
        run: |
          python .task7/apply_task7.py
          python .task7/fix_candidate.py
          python .task7/fix_worker_tests.py
          python .task7/repair_failures.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path.cwd(); path=root/'config/portable-installation-manifest.json'
          m=json.loads(path.read_text())
          def canon(v): return json.dumps(v,ensure_ascii=False,allow_nan=False,sort_keys=True,separators=(',',':'))
          def digest(v): return 'sha256:'+hashlib.sha256(canon(v).encode()).hexdigest()
          def bytes_digest(p): return 'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          for name,c in m['components'].items():
              base=root/c['root']
              if c['scope']=='runtime-dependency-closure': files=tuple(c['files'])
              else:
                  prod=base/c['production_root']
                  files=tuple(sorted(p.relative_to(base).as_posix() for p in prod.rglob('*.py') if '__pycache__' not in p.parts))
              entries=[{'path':f,'sha256':bytes_digest(base/f)} for f in files]
              c['digest']=digest(entries)
          path.write_text(json.dumps(m,indent=2)+'\n')
          PY
          python .task7/finalize_docs.py
      - name: Commit materialized candidate only
        run: |
          git config user.name "Task 7 Validation"
          git config user.email "task7-validation@users.noreply.github.com"
          git add -A components config docs tools
          git diff --cached --name-only
          test -z "$(git diff --cached --name-only | grep -E '^\.task7/|^\.github/workflows/' || true)"
          git commit -m "wip: materialize Task 7 candidate [skip ci]"
          git push origin HEAD:task7-obsolete-cleanup-temp

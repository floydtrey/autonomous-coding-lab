name: Task 7 Materialize Candidate
on:
  push:
    branches: [task7-obsolete-cleanup-temp]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimize protected catalog diff when requested
        run: |
          if [ -f .task7/minimize_catalog.py ]; then
            python .task7/minimize_catalog.py
          else
            echo "No catalog minimizer present; nothing to do."
          fi
      - name: Commit minimized candidate when changed
        run: |
          if git diff --quiet -- components/worker-lab/curricula/catalogs/worker-lab-v3.json; then
            echo "No materialized source change to commit."
            exit 0
          fi
          git config user.name "Task 7 Validation"
          git config user.email "task7-validation@users.noreply.github.com"
          git add components/worker-lab/curricula/catalogs/worker-lab-v3.json
          git commit -m "wip: minimize Task 7 protected catalog diff [skip ci]"
          git push origin HEAD:task7-obsolete-cleanup-temp

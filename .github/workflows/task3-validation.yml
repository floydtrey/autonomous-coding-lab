name: Task 3 Validation

on:
  push:
    branches:
      - task3-validation-temp

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/worker-lab
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile Worker Lab
        run: python -m compileall -q worker_lab tests

      - name: Run V2 compatibility and Task 3 suites
        run: >-
          python -m pytest -q
          tests/test_runtime_selection.py
          tests/test_provider_qualification.py
          tests/test_integration.py
          tests/test_framework_adapter.py
          tests/test_application_service.py
          tests/test_runtime_selection_v3.py
          tests/test_provider_binding.py
          tests/test_integration_v3.py

      - name: Compute portable Worker Lab production-tree digest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          entries = []
          for path in sorted(Path("worker_lab").rglob("*.py")):
              if "__pycache__" in path.parts:
                  continue
              data = path.read_bytes()
              entries.append({
                  "path": path.as_posix(),
                  "sha256": "sha256:" + hashlib.sha256(data).hexdigest(),
              })
          encoded = json.dumps(entries, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          digest = "sha256:" + hashlib.sha256(encoded).hexdigest()
          print(f"WORKER_LAB_FILE_COUNT={len(entries)}")
          print(f"WORKER_LAB_PORTABLE_DIGEST={digest}")
          PY

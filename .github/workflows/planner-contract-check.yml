name: Planner Contract Check

on:
  push:
    branches:
      - planner-v1-development
    paths:
      - "acl_roles/planner/**"
      - "acl_roles/__init__.py"
      - "tests/test_planner_contract.py"
      - ".github/workflows/planner-contract-check.yml"
  workflow_dispatch:

jobs:
  planner-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Planner contract
        run: python -m py_compile acl_roles/planner/contract.py acl_roles/planner/__init__.py acl_roles/__init__.py

      - name: Run Planner contract self-checks
        run: python -m unittest discover -s tests -p "test_planner_contract.py" -v

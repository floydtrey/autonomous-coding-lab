name: Planner Development Check

on:
  push:
    branches:
      - planner-v1-development
    paths:
      - "acl_roles/planner/**"
      - "acl_roles/__init__.py"
      - "acl_core/authority/**"
      - "acl_core/__init__.py"
      - "acl_controller/authority/**"
      - "acl_controller/service.py"
      - "acl_controller/__init__.py"
      - "config/filesystem_authority.json"
      - "tests/test_planner_*.py"
      - "tests/test_filesystem_authority.py"
      - ".github/workflows/planner-contract-check.yml"
  workflow_dispatch:

jobs:
  planner-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Planner and authority modules
        run: >-
          python -m py_compile
          acl_roles/planner/contract.py
          acl_roles/planner/elevation.py
          acl_roles/planner/__init__.py
          acl_roles/__init__.py
          acl_core/authority/filesystem.py
          acl_core/authority/__init__.py
          acl_controller/authority/filesystem.py
          acl_controller/service.py

      - name: Run Planner self-checks
        run: python -m unittest discover -s tests -p "test_planner_*.py" -v

      - name: Run filesystem authority self-checks
        run: python -m unittest discover -s tests -p "test_filesystem_authority.py" -v

name: Planner Development Check

on:
  workflow_dispatch:
  push:
    branches:
      - planner-seam-repair-development

jobs:
  planner-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runtime
        run: python -m pip install -e . pytest

      - name: Compile repaired Planner path
        run: >-
          python -m py_compile
          acl_roles/planner/semantic.py
          acl_roles/planner/contract.py
          acl_controller/planner/compiler.py
          acl_controller/planner/runtime.py
          acl_controller/authority/pass_authority.py
          acl_controller/worker/execution.py
          acl_adapters/agent_session.py
          acl_adapters/context_pressure.py
          acl_adapters/openai_compatible.py
          acl_adapters/openai_agent.py
          tools/planner_output_benchmark.py
          tools/planner_integration_benchmark.py
          acl_controller/service.py

      - name: Run repository tests
        run: python -m pytest -q

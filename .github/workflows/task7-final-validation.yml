name: Task 7 Final Exact-Byte Validation
on:
  push:
    branches: [task7-final-validation-temp]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 2f07f80e07ac280f911b02e71199a482357cf669
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Assert exact clean checkpoint
        run: |
          test "$(git rev-parse HEAD)" = "2f07f80e07ac280f911b02e71199a482357cf669"
          test "$(git rev-parse HEAD^)" = "1867b66c9e076a986838d3284eb3a15088b1cb08"
          test -z "$(git ls-tree -r --name-only HEAD | grep -E '^\.task7/|^\.github/workflows/task7-' || true)"
          test "$(git status --porcelain)" = ""
      - name: Compile current production
        run: python -m compileall -q components/autonomous-worker-framework/tools components/worker-lab/worker_lab
      - name: Import current Worker Lab service
        env:
          PYTHONPATH: components/worker-lab
        run: python -c "from worker_lab.application_service import WorkerLabApplicationService; from worker_lab.service_runtime_v3 import prepare_invocation; print('CURRENT_SERVICE_IMPORT_OK')"
      - name: Run complete surviving AWF suite
        working-directory: components/autonomous-worker-framework
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Run complete surviving Worker Lab suite
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Run portable contract
        env:
          PYTHONPATH: components/worker-lab
        run: python -m pytest -q tests/test_portable_installation.py
      - name: Verify disabled portable identities
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path.cwd(); manifest=json.loads((root/'config/portable-installation-manifest.json').read_text())
          assert manifest['activation_policy']['execution_authority'] == 'DISABLED'
          def canon(v): return json.dumps(v,ensure_ascii=False,allow_nan=False,sort_keys=True,separators=(',',':'))
          def digest(v): return 'sha256:'+hashlib.sha256(canon(v).encode()).hexdigest()
          def bd(p): return 'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          expected={
            'autonomous-worker-framework': (8,'sha256:edac32b728348d6a2e2c7521d1c846e5021fe6e40f33db70e7df625d1ca584c5'),
            'local-model-bench': (10,'sha256:139331ea42c914575d1119125a702ac5de2129b9bedc235bfc189700e8265afc'),
            'worker-lab': (29,'sha256:8b92b879d555d3c695318809895947b0a6ac9b1e87cf6caef5db5ad7541549e7'),
          }
          for name,c in manifest['components'].items():
            base=root/c['root']
            if c['scope']=='runtime-dependency-closure': files=tuple(c['files'])
            else:
              prod=base/c['production_root']; files=tuple(sorted(p.relative_to(base).as_posix() for p in prod.rglob('*.py') if '__pycache__' not in p.parts))
            observed=digest([{'path':f,'sha256':bd(base/f)} for f in files])
            assert (len(files),observed)==expected[name], (name,len(files),observed)
            assert c['digest']==observed
            print(name,len(files),observed,'MATCH')
          print('EXECUTION_AUTHORITY',manifest['activation_policy']['execution_authority'])
          PY
      - name: Assert obsolete active runtime is absent
        run: |
          python - <<'PY'
          from pathlib import Path
          terms=('codex','terra','minetrackerworker','mine_tracker','mine tracker','autonomy_smoke','acl-installation-manifest:v2','installation_manifest','framework_client','worker_lab_adapter','workspace_write_adapter','synthetic_read_only','local_worker_harness','monorepo_identity')
          roots=[Path('components/autonomous-worker-framework/tools'),Path('components/worker-lab/worker_lab'),Path('config')]
          hits=[]
          for root in roots:
            for p in sorted(x for x in root.rglob('*') if x.is_file() and x.suffix in {'.py','.json'}):
              for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                if any(t in line.lower() for t in terms): hits.append(f'{p}:{i}:{line}')
          assert not hits, '\n'.join(hits)
          print('OBSOLETE_ACTIVE_RUNTIME_SCAN EMPTY')
          PY

name: Task 6 Clean Checkpoint Validation
on:
  push:
    branches: [task6-final-validation-temp]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact clean Task 6 commit
        run: git checkout --detach 1867b66c9e076a986838d3284eb3a15088b1cb08
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Verify exact commit and diff boundary
        run: |
          test "$(git rev-parse HEAD)" = "1867b66c9e076a986838d3284eb3a15088b1cb08"
          test "$(git rev-list --count 06526300d9928faa32a5a87af05b1fd77b5d11ff..HEAD)" = "1"
          test "$(git diff --name-only 06526300d9928faa32a5a87af05b1fd77b5d11ff..HEAD | wc -l)" = "15"
          ! git diff --name-only 06526300d9928faa32a5a87af05b1fd77b5d11ff..HEAD | grep -E '^\.task6/|^\.github/workflows/'
      - name: Compile Task 6 path
        run: |
          python -m py_compile \
            components/worker-lab/worker_lab/runtime_settings.py \
            components/worker-lab/worker_lab/provider_qualification.py \
            components/worker-lab/worker_lab/provider_binding.py \
            components/autonomous-worker-framework/tools/dispatch_adapter.py \
            components/autonomous-worker-framework/tools/pydantic_ollama_worker.py
      - name: Worker Lab Task 6 contracts
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_provider_qualification.py \
            tests/test_provider_binding.py \
            tests/test_runtime_selection_v3.py \
            tests/test_integration_v3.py \
            tests/test_dispatch_client.py \
            tests/test_application_service_v3.py
      - name: Framework Task 6 contracts
        working-directory: components/autonomous-worker-framework
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_pydantic_ollama_worker.py \
            tests/test_dispatch_adapter.py \
            tests/test_worker_runtime_seam.py \
            tests/test_code_task.py
      - name: Task 5 regressions
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_process_custody.py tests/test_windows_job.py
          python -m pytest -q tests/test_application_service.py -k "not health_and_installation_status_are_non_mutating_and_disabled and not absent_data_root_is_healthy_empty_and_remains_absent and not queries_reject_invalid_data_roots_without_mutation and not cli_exposes_service_health_list_and_show"
          python -m pytest -q tests/test_cli.py -k "not doctor_reports_disabled_installation_without_execution"
      - name: Verify portable identity and disabled execution
        env:
          PYTHONPATH: components/worker-lab
        run: |
          python - <<'PY'
          import importlib.util, json, inspect
          from pathlib import Path
          root=Path.cwd()
          spec=importlib.util.spec_from_file_location('portable_verify', root/'tools'/'verify_portable_installation.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          manifest=json.loads((root/'config'/'portable-installation-manifest.json').read_text())
          expected={
            'autonomous-worker-framework':('12','sha256:ceec8a2e022d4ad253ea6848eb241b4646da2ee32ac90d0747ba87f66aa6d51a'),
            'worker-lab':('36','sha256:2b14eff998eb282468edacecb8b68b69b184620e73ccf8dc688bb78cb9feb70a'),
          }
          for name,(count,digest) in expected.items():
              result=mod._inspect_component(root,name,manifest['components'][name])
              assert result['status']=='MATCH'
              assert str(result['file_count'])==count and result['digest']==digest
          assert manifest['activation_policy']['execution_authority']=='DISABLED'
          from worker_lab.provider_qualification import qualify_provider_capabilities
          assert inspect.signature(qualify_provider_capabilities).parameters['probe_runner'].default is inspect.Parameter.empty
          PY
          python -m pytest -q tests/test_portable_installation.py
      - name: Confirm known legacy boundary only
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_application_service.py::test_health_and_installation_status_are_non_mutating_and_disabled \
            tests/test_cli.py::test_doctor_reports_disabled_installation_without_execution \
            > /tmp/task6-known-boundary.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'framework runtime closure is incomplete' /tmp/task6-known-boundary.log

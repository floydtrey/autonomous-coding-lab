name: Knowledge Core

on:
  push:
    branches:
      - architecture/knowledge-core
    paths:
      - "components/knowledge-core/**"
      - ".github/workflows/knowledge-core.yml"
  pull_request:
    paths:
      - "components/knowledge-core/**"
      - ".github/workflows/knowledge-core.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/knowledge-core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: components/knowledge-core/pyproject.toml

      - name: Install Knowledge Core
        run: python -m pip install -e ".[test]"

      - name: Run Knowledge Core suite
        run: python -m pytest -q

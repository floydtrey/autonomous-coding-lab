name: Knowledge Core

on:
  push:
    branches:
      - architecture/knowledge-core
    paths:
      - "components/knowledge-core/**"
      - ".github/workflows/knowledge-core.yml"
  pull_request:
    paths:
      - "components/knowledge-core/**"
      - ".github/workflows/knowledge-core.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: knowledge_core_test
          POSTGRES_PASSWORD: knowledge_core_test
          POSTGRES_DB: knowledge_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge_core_test -d knowledge_core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KNOWLEDGE_CORE_DATABASE_URL: postgresql+psycopg://knowledge_core_test:knowledge_core_test@127.0.0.1:5432/knowledge_core_test
      KNOWLEDGE_CORE_POSTGRES_TEST_URL: postgresql+psycopg://knowledge_core_test:knowledge_core_test@127.0.0.1:5432/knowledge_core_test
    defaults:
      run:
        working-directory: components/knowledge-core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: components/knowledge-core/pyproject.toml

      - name: Install Knowledge Core
        run: python -m pip install -e ".[test]"

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Run fast semantic suite
        run: python -m pytest -q -m "not postgresql"

      - name: Run PostgreSQL qualification suite
        run: python -m pytest -q -m postgresql

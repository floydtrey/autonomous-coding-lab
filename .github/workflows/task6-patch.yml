name: Task 6 Candidate Validation
on:
  push:
    branches: [task6-provider-qualification]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Materialize Task 6 candidate
        run: python .task6/apply_task6.py
      - name: Compile changed current path
        run: |
          python -m py_compile \
            components/worker-lab/worker_lab/runtime_settings.py \
            components/worker-lab/worker_lab/provider_qualification.py \
            components/worker-lab/worker_lab/provider_binding.py \
            components/autonomous-worker-framework/tools/dispatch_adapter.py \
            components/autonomous-worker-framework/tools/pydantic_ollama_worker.py
      - name: Run Task 6 Worker Lab contract tests
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_provider_qualification.py \
            tests/test_provider_binding.py \
            tests/test_runtime_selection_v3.py \
            tests/test_integration_v3.py \
            tests/test_dispatch_client.py \
            tests/test_application_service_v3.py
      - name: Run Task 6 framework contract tests
        working-directory: components/autonomous-worker-framework
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_pydantic_ollama_worker.py \
            tests/test_dispatch_adapter.py \
            tests/test_worker_runtime_seam.py \
            tests/test_code_task.py
      - name: Confirm no provider/model endpoint was invoked by tests
        run: |
          ! grep -RIn --exclude='provider_qualification.py' --exclude='test_provider_qualification.py' --exclude='*.md' '/api/chat\|/v1/chat/completions' .task6 components/worker-lab/tests components/autonomous-worker-framework/tests
      - name: Commit materialized candidate
        run: |
          git config user.name 'Task 6 Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add components/worker-lab/worker_lab/runtime_settings.py \
                  components/worker-lab/worker_lab/provider_qualification.py \
                  components/worker-lab/worker_lab/provider_binding.py \
                  components/worker-lab/tests/provider_capability_fixture.py \
                  components/worker-lab/tests/test_provider_qualification.py \
                  components/worker-lab/tests/test_provider_binding.py \
                  components/worker-lab/tests/test_integration_v3.py \
                  components/worker-lab/tests/test_dispatch_client.py \
                  components/autonomous-worker-framework/tools/dispatch_adapter.py \
                  components/autonomous-worker-framework/tools/pydantic_ollama_worker.py \
                  components/autonomous-worker-framework/tests/test_dispatch_adapter.py \
                  components/autonomous-worker-framework/tests/test_pydantic_ollama_worker.py
          git diff --cached --check
          git commit -m 'wip: materialize Task 6 provider qualification'
          git push origin HEAD:task6-provider-qualification

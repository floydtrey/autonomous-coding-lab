name: Task 7 Cleanup Candidate
on:
  push:
    branches: [task7-obsolete-cleanup-temp]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Materialize Task 7 cleanup
        run: |
          python .task7/apply_task7.py
          python .task7/fix_candidate.py
      - name: Refresh portable V1 byte identities
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path.cwd(); path=root/'config/portable-installation-manifest.json'
          m=json.loads(path.read_text())
          def canon(v): return json.dumps(v,ensure_ascii=False,allow_nan=False,sort_keys=True,separators=(',',':'))
          def digest(v): return 'sha256:'+hashlib.sha256(canon(v).encode()).hexdigest()
          def bytes_digest(p): return 'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          for name,c in m['components'].items():
              base=root/c['root']
              if c['scope']=='runtime-dependency-closure': files=tuple(c['files'])
              else:
                  prod=base/c['production_root']
                  files=tuple(sorted(p.relative_to(base).as_posix() for p in prod.rglob('*.py') if '__pycache__' not in p.parts))
              entries=[{'path':f,'sha256':bytes_digest(base/f)} for f in files]
              c['digest']=digest(entries); print(name,len(files),c['digest'])
          path.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Compile current production
        run: python -m compileall -q components/autonomous-worker-framework/tools components/worker-lab/worker_lab
      - name: Import current Worker Lab service
        env:
          PYTHONPATH: components/worker-lab
        run: python -c "from worker_lab.application_service import WorkerLabApplicationService; from worker_lab.service_runtime_v3 import prepare_invocation; print('CURRENT_SERVICE_IMPORT_OK')"
      - name: Run remaining AWF behavioral tests
        working-directory: components/autonomous-worker-framework
        env:
          PYTHONPATH: .
        run: python -m pytest -q --ignore=tests/test_project_documentation.py
      - name: Run all remaining Worker Lab tests
        working-directory: components/worker-lab
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Run root portable tests
        env:
          PYTHONPATH: components/worker-lab
        run: python -m pytest -q tests/test_portable_installation.py
      - name: Show cleanup diff and residual production references
        if: always()
        run: |
          git status --short
          python - <<'PY'
          from pathlib import Path
          terms=('codex','terra','minetrackerworker','mine_tracker','mine tracker','autonomy_smoke','acl-installation-manifest:v2','installation_manifest','framework_client','worker_lab_adapter','workspace_write_adapter','synthetic_read_only','local_worker_harness','monorepo_identity')
          roots=[Path('components/autonomous-worker-framework/tools'),Path('components/worker-lab/worker_lab'),Path('config')]
          print('=== RESIDUAL PRODUCTION/CONFIG OBSOLETE REFERENCES ===')
          for root in roots:
              for p in sorted(x for x in root.rglob('*') if x.is_file() and x.suffix in {'.py','.json'}):
                  for i,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                      lower=line.lower()
                      if any(t in lower for t in terms): print(f'{p}:{i}:{line[:220]}')
          PY

name: M09B branch verification

on:
  push:
    branches:
      - m09b-development

permissions:
  contents: write

jobs:
  windows-focused:
    if: github.event.head_commit.message != 'ci: record M09B verification'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m09b-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: |
          python -m pip install pytest
          python -m pip install -e components/worker-lab
      - name: Run focused M09B verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $Head = (git rev-parse HEAD).Trim()
          Push-Location components/worker-lab
          $Focused = (& python -m pytest -q tests/test_m09b_sequential_controller.py tests/test_m09a_job_execution.py tests/test_job_runner.py tests/test_job_admission.py 2>&1 | Out-String)
          $FocusedExit = $LASTEXITCODE
          Pop-Location
          $Portable = (& python -m pytest -q tests/test_portable_source.py 2>&1 | Out-String)
          $PortableExit = $LASTEXITCODE
          New-Item -ItemType Directory -Force .m09b | Out-Null
          @"
          tested_commit=$Head
          focused_exit=$FocusedExit
          portable_exit=$PortableExit

          === focused ===
          $Focused
          === portable ===
          $Portable
          "@ | Set-Content -Encoding UTF8 .m09b/verification-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .m09b/verification-report.txt
          git commit -m "ci: record M09B verification"
          git push origin HEAD:m09b-development
          if ($FocusedExit -ne 0 -or $PortableExit -ne 0) { exit 1 }

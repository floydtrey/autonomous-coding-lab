name: M09B branch verification

on:
  pull_request:
    branches:
      - architecture/knowledge-core
  workflow_dispatch:

jobs:
  source-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute worker-lab source digest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          component = Path("components/worker-lab")
          production = component / "worker_lab"
          entries = []
          for path in sorted(p for p in production.rglob("*.py") if "__pycache__" not in p.parts):
              entries.append({
                  "path": path.relative_to(component).as_posix(),
                  "sha256": "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          raw = json.dumps(entries, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(",", ":")).encode()
          print("WORKER_LAB_FILE_COUNT=" + str(len(entries)))
          print("WORKER_LAB_DIGEST=sha256:" + hashlib.sha256(raw).hexdigest())
          PY
      - name: Compile M09B production files
        run: |
          python -m py_compile             components/worker-lab/worker_lab/sequential_controller.py             components/worker-lab/worker_lab/application_service.py             components/worker-lab/worker_lab/cli.py

  windows-focused:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run M09B and affected job tests
        working-directory: components/worker-lab
        run: >
          python -m pytest -q
          tests/test_m09b_sequential_controller.py
          tests/test_m09a_job_execution.py
          tests/test_job_runner.py
          tests/test_job_admission.py
      - name: Verify portable source identity
        working-directory: ../..
        run: python -m pytest -q tests/test_portable_source.py

name: M09B branch verification

on:
  pull_request:
    branches:
      - architecture/knowledge-core

jobs:
  windows-focused:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: |
          python -m pip install pytest
          python -m pip install -e components/worker-lab
      - name: Run M09B and affected Windows tests
        working-directory: components/worker-lab
        run: >
          python -m pytest -q
          tests/test_m09b_sequential_controller.py
          tests/test_m09a_job_execution.py
          tests/test_job_runner.py
          tests/test_job_admission.py
      - name: Verify portable source identity
        run: python -m pytest -q tests/test_portable_source.py

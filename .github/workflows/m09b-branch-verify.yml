name: M09B branch verification

on:
  push:
    branches:
      - m09b-development

permissions:
  contents: write

jobs:
  refresh-source:
    if: github.event.head_commit.message != 'ci: record M09B verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m09b-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh exact worker-lab source identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          component = Path("components/worker-lab")
          production = component / "worker_lab"
          entries = []
          for path in sorted(p for p in production.rglob("*.py") if "__pycache__" not in p.parts):
              entries.append({
                  "path": path.relative_to(component).as_posix(),
                  "sha256": "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          raw = json.dumps(entries, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(",", ":")).encode()
          digest = "sha256:" + hashlib.sha256(raw).hexdigest()
          manifest_path = Path("config/portable-source-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["components"]["worker-lab"]["digest"] = digest
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("WORKER_LAB_FILE_COUNT=" + str(len(entries)))
          print("WORKER_LAB_DIGEST=" + digest)
          PY
          if ! git diff --quiet -- config/portable-source-manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/portable-source-manifest.json
            git commit -m "ci: refresh M09B source identity"
            git push origin HEAD:m09b-development
          fi

  windows-focused:
    needs: refresh-source
    if: github.event.head_commit.message == 'ci: refresh M09B source identity'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m09b-development
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: |
          python -m pip install pytest
          python -m pip install -e components/worker-lab
      - name: Run focused verification and record exact output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $Head = (git rev-parse HEAD).Trim()
          $Focused = (& python -m pytest -q components/worker-lab/tests/test_m09b_sequential_controller.py components/worker-lab/tests/test_m09a_job_execution.py components/worker-lab/tests/test_job_runner.py components/worker-lab/tests/test_job_admission.py 2>&1 | Out-String)
          $FocusedExit = $LASTEXITCODE
          $Portable = (& python -m pytest -q tests/test_portable_source.py 2>&1 | Out-String)
          $PortableExit = $LASTEXITCODE
          New-Item -ItemType Directory -Force .m09b | Out-Null
          @"
          tested_commit=$Head
          focused_exit=$FocusedExit
          portable_exit=$PortableExit

          === focused ===
          $Focused
          === portable ===
          $Portable
          "@ | Set-Content -Encoding UTF8 .m09b/verification-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .m09b/verification-report.txt
          git commit -m "ci: record M09B verification"
          git push origin HEAD:m09b-development
          if ($FocusedExit -ne 0 -or $PortableExit -ne 0) { exit 1 }

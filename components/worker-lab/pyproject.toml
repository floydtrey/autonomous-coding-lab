[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worker-lab"
version = "0.1.0.dev0"
description = "Local-first worker learning and evaluation platform"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
worker-lab = "worker_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

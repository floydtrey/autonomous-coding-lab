[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-core"
version = "0.1.0.dev0"
description = "Canonical Knowledge Core kernel"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
]
graphiti = [
  "graphiti-core[falkordb]==0.30.2",
]
service = [
  "uvicorn>=0.32,<1",
]

[tool.setuptools.packages.find]
include = ["knowledge_core*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgresql: tests that require a migrated real PostgreSQL database",
  "sr2_real_pilot: SR-2 G22 tiny pinned real-document pilot; excluded from G1-G21 qualification",
]

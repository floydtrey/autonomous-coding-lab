[project]
name = "acl-core"
version = "0.1.0.dev0"
description = "Provider-neutral infrastructure core for Autonomous Coding Lab"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["acl_core*"]
namespaces = false

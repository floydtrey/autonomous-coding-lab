[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acl-next"
version = "0.1.0.dev0"
description = "Clean rebuild of Autonomous Coding Lab"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["acl_core*", "acl_controller*", "acl_roles*", "acl_adapters*", "acl_runtime*"]
namespaces = false

[project.scripts]
acl-run-workflow = "acl_runtime.runner:main"
